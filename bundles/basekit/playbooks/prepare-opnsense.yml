---
# ==================================================================
# Generate and Stage OPNsense Configuration
# ==================================================================

- name: Generate OPNsense configuration
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:

    # ============================================================
    # Load Bundle Configuration
    # ============================================================

    - name: Load bundle variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../vars.yml"

    - name: Apply environment bundle overrides
      ansible.builtin.set_fact:
        bundle: >-
          {{
            bundle_vars |
            combine(
              bundle_overrides | default({}),
              recursive=true
            )
          }}

  vars:
    generated_dir: "{{ klm_home }}/state/generated"
    output_file: "{{ generated_dir }}/config.xml"
    template_file: >-
      {{ playbook_dir }}/../templates/{{ bundle.opnsense.template_name }}

  tasks:

    # ============================================================
    # Validate Environment DNS Configuration
    # ============================================================

    - name: Verify WAN DNS configuration is valid
      ansible.builtin.assert:
        that:
          - wan_dns is defined
          - wan_dns.servers is defined
          - wan_dns.servers | length > 0
        fail_msg: >-
          wan_dns.servers must contain at least one DNS server for this
          environment.

    - name: Verify DNS forwarding entries have a usable server list
      ansible.builtin.assert:
        that:
          - item.domain is defined
          - item.domain | length > 0
          - (item.servers | default(wan_dns.servers, true)) | length > 0
        fail_msg: >-
          DNS forwarding entry {{ item | to_nice_json }} does not have a
          domain or usable DNS server list.
      loop: "{{ wan_dns.forwarding | default([]) }}"
      loop_control:
        label: "{{ item.domain | default('undefined') }}"

    # ============================================================
    # Generate Configuration
    # ============================================================

    - name: Ensure generated configuration directory exists
      ansible.builtin.file:
        path: "{{ generated_dir }}"
        state: directory
        mode: "0755"

    - name: Generate OPNsense configuration
      ansible.builtin.template:
        src: "{{ template_file }}"
        dest: "{{ output_file }}"
        mode: "0644"


# ==================================================================
# Stage OPNsense Files on Libvirt Host
# ==================================================================

- name: Stage OPNsense files on libvirt host
  hosts: klm_host
  gather_facts: false
  become: true

  pre_tasks:

    # ============================================================
    # Load Bundle Configuration
    # ============================================================

    - name: Load bundle variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../vars.yml"

    - name: Apply environment bundle overrides
      ansible.builtin.set_fact:
        bundle: >-
          {{
            bundle_vars |
            combine(
              bundle_overrides | default({}),
              recursive=true
            )
          }}

  vars:
    generated_config: "{{ klm_home }}/state/generated/config.xml"
    staged_config: "{{ bundle.libvirt.dirs.opnsense }}/config.xml"
    installer_iso_source: >-
      {{ playbook_dir }}/../images/{{ bundle.opnsense.iso_name }}
    installer_iso_dest: >-
      {{ bundle.libvirt.dirs.config_images }}/{{ bundle.opnsense.iso_name }}

  tasks:

    # ============================================================
    # Stage OPNsense Configuration
    # ============================================================

    - name: Ensure OPNsense configuration directory exists
      ansible.builtin.file:
        path: "{{ bundle.libvirt.dirs.opnsense }}"
        state: directory
        owner: "{{ bundle.libvirt.qemu_user }}"
        group: "{{ bundle.libvirt.qemu_group }}"
        mode: "0755"

    - name: Stage generated OPNsense configuration
      ansible.builtin.copy:
        src: "{{ generated_config }}"
        dest: "{{ staged_config }}"
        owner: "{{ bundle.libvirt.qemu_user }}"
        group: "{{ bundle.libvirt.qemu_group }}"
        mode: "0644"

    # ============================================================
    # Stage OPNsense Installer ISO
    # ============================================================

    - name: Stage OPNsense installer ISO
      ansible.builtin.copy:
        src: "{{ installer_iso_source }}"
        dest: "{{ installer_iso_dest }}"
        owner: "{{ bundle.libvirt.qemu_user }}"
        group: "{{ bundle.libvirt.qemu_group }}"
        mode: "0644"

    # ============================================================
    # SELinux
    # ============================================================

    - name: Restore SELinux context on OPNsense configuration
      ansible.builtin.command:
        cmd: "restorecon -v {{ staged_config }}"
      register: config_restorecon
      changed_when: config_restorecon.stdout is search('Relabeled|reset')

    - name: Restore SELinux context on OPNsense installer ISO
      ansible.builtin.command:
        cmd: "restorecon -v {{ installer_iso_dest }}"
      register: iso_restorecon
      changed_when: iso_restorecon.stdout is search('Relabeled|reset')
