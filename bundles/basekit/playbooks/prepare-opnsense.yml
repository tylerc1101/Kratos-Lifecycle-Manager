---
# ==================================================================
# Generate OPNsense Configuration
# ==================================================================

- name: Generate OPNsense configuration
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:
    # ============================================================
    # Load Bundle Configuration
    # ============================================================

    - name: Load bundle variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../vars.yml"

    - name: Apply environment bundle overrides
      ansible.builtin.set_fact:
        bundle: >-
          {{
            bundle_vars |
            combine(
              bundle_overrides | default({}),
              recursive=true
            )
          }}

  vars:
    template_file: >-
      {{ playbook_dir }}/../templates/{{ bundle.opnsense.template_name }}

    output_dir: "{{ klm_home }}/state/generated"

    output_file: "{{ output_dir }}/config.xml"

  tasks:
    # ============================================================
    # Generate Configuration
    # ============================================================

    - name: Ensure generated output directory exists
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"

    - name: Read OPNsense configuration template
      ansible.builtin.slurp:
        src: "{{ template_file }}"
      register: template_content

    - name: Generate OPNsense configuration
      ansible.builtin.copy:
        content: |
          {{ template_content.content | b64decode |
             regex_replace('__WAN_IP__', opnsense.wan_ip) |
             regex_replace('__WAN_GATEWAY__', opnsense.gateway) |
             regex_replace('__WAN_SUBNET__', opnsense.cidr | string) |
             regex_replace('__NTP_TIMESERVERS__', ntp_servers | join(',')) |
             regex_replace('__NTP_PREFER__', ntp_servers | join(',')) |
             regex_replace('__OPNSENSE_HOSTNAME__', bundle.opnsense.hostname) |
             regex_replace('__OPNSENSE_DOMAIN__', domain_name) |
             regex_replace('__INTERFACE_WAN__', bundle.opnsense.interfaces.wan) |
             regex_replace('__INTERFACE_LAN__', bundle.opnsense.interfaces.lan) |
             regex_replace('__INTERFACE_OPT1__', bundle.opnsense.interfaces.opt1) }}
        dest: "{{ output_file }}"
        mode: "0644"


# ==================================================================
# Stage OPNsense Files
# ==================================================================

- name: Stage OPNsense files on mgmt-kvm
  hosts: klm_host
  gather_facts: false
  become: true

  pre_tasks:
    # ============================================================
    # Load Bundle Configuration
    # ============================================================

    - name: Load bundle variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../vars.yml"

    - name: Apply environment bundle overrides
      ansible.builtin.set_fact:
        bundle: >-
          {{
            bundle_vars |
            combine(
              bundle_overrides | default({}),
              recursive=true
            )
          }}

  vars:
    generated_config: "{{ klm_home }}/state/generated/config.xml"

  tasks:
    # ============================================================
    # Stage Configuration
    # ============================================================

    - name: Copy generated OPNsense configuration
      ansible.builtin.copy:
        src: "{{ generated_config }}"
        dest: "{{ bundle.libvirt.dirs.opnsense }}/config.xml"
        owner: "{{ bundle.libvirt.qemu_user }}"
        group: "{{ bundle.libvirt.qemu_group }}"
        mode: "0644"


    # ============================================================
    # Stage Installer
    # ============================================================

    - name: Copy OPNsense installer ISO
      ansible.builtin.copy:
        src: >-
          {{ playbook_dir }}/../images/{{ bundle.opnsense.iso_name }}
        dest: >-
          {{ bundle.libvirt.dirs.config_images }}/{{ bundle.opnsense.iso_name }}
        owner: "{{ bundle.libvirt.qemu_user }}"
        group: "{{ bundle.libvirt.qemu_group }}"
        mode: "0644"


    # ============================================================
    # SELinux
    # ============================================================

    - name: Restore SELinux context on OPNsense configuration
      ansible.builtin.command:
        cmd: >-
          restorecon -v
          {{ bundle.libvirt.dirs.opnsense }}/config.xml
      register: restore_opnsense_config
      changed_when: restore_opnsense_config.stdout is search("Relabeled|reset")

    - name: Restore SELinux context on OPNsense installer ISO
      ansible.builtin.command:
        cmd: >-
          restorecon -v
          {{ bundle.libvirt.dirs.config_images }}/{{ bundle.opnsense.iso_name }}
      register: restore_opnsense_iso
      changed_when: restore_opnsense_iso.stdout is search("Relabeled|reset")