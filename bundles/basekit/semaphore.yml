repositories:
  - name: BaseKit
    url: file:///opt/openspace/bundles/basekit
    branch: main

views:
  - name: BaseKit Tasks

templates:

  - name: Bootstrap MGMT KVM
    description: Perform the initial BaseKit configuration of the management KVM host.
    view: BaseKit
    repository: BaseKit
    playbook: playbooks/bootstrap-mgmt-kvm.yml

  - name: Prepare OPNSense
    description: Stage OPNSense installation content and generate the baseline config.xml.
    view: BaseKit
    repository: BaseKit
    playbook: playbooks/prepare-opnsense.yml

  - name: Install OPNSense
    description: Deploy the OPNSense virtual machine.
    view: BaseKit
    repository: BaseKit
    app: bash
    playbook: scripts/install_opnsense.sh

  - name: Stage RHEL Image
    description: Stage the RHEL golden image on the management KVM host.
    view: BaseKit
    repository: BaseKit
    playbook: playbooks/stage-rhel-image.yml

  - name: Deploy VMs
    description: Deploy requested BaseKit virtual machines.
    view: BaseKit
    repository: BaseKit
    playbook: playbooks/deploy-vms.yml

  - name: Bootstrap Nodes
    description: Configure newly deployed nodes with hostname, repositories, NTP, and baseline settings.
    view: BaseKit
    repository: BaseKit
    playbook: playbooks/bootstrap-nodes.yml
