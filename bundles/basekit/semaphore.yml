repositories:
  - name: BaseKit
    url: file:///opt/openspace/bundles/basekit
    branch: main

views:
  - name: BaseKit

templates:
  - name: Generate SSH Key
    description: Generate the SSH key material used during BaseKit installation.
    view: BaseKit
    repository: BaseKit
    playbook: playbooks/generate-ssh-key.yml

  - name: Push SSH Key
    description: Push the generated SSH key to selected hosts.
    view: BaseKit
    repository: BaseKit
    playbook: playbooks/push-ssh-key.yml

  - name: Bootstrap MGMT KVM
    description: Bootstrap the management KVM host.
    view: BaseKit
    repository: BaseKit
    playbook: playbooks/bootstrap-mgmt-kvm.yml

  - name: Configure OPNSense
    description: Configure the reusable BaseKit OPNSense baseline.
    view: BaseKit
    repository: BaseKit
    playbook: playbooks/configure-opnsense.yml

  - name: Copy OPNSense Config
    description: Copy the generated OPNSense configuration into place.
    view: BaseKit
    repository: BaseKit
    playbook: playbooks/copy-opnsense-config.yml

  - name: Install OPNSense
    description: Run the BaseKit OPNSense installation script.
    view: BaseKit
    repository: BaseKit
    app: bash
    playbook: scripts/install_opnsense.sh

  - name: Deploy VMs
    description: Deploy the BaseKit virtual machines.
    view: BaseKit
    repository: BaseKit
    playbook: playbooks/deploy-vms.yml
