---
- name: Prepare OpenSpace Kubernetes hosts
  hosts: mcm:osms:osdc
  become: true
  gather_facts: false
  pre_tasks:
    - name: Load bundle variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../vars.yml"

    - name: Apply environment bundle overrides
      ansible.builtin.set_fact:
        bundle: >-
          {{
            bundle_vars |
            combine(
              bundle_overrides | default({}),
              recursive=true
            )
          }}

  tasks:
    # ------------------------------------------------------------------
    # Common MCM / OSMS / OSDC configuration
    # ------------------------------------------------------------------

    - name: Copy RKE2 SELinux RPM to /tmp
      ansible.builtin.copy:
        src: "../images/{{ bundle['rke2-selinux-rpm'] }}"
        dest: "/tmp/{{ bundle['rke2-selinux-rpm'] }}"
        remote_src: false
        owner: root
        group: root
        mode: "0644"
    
    - name: Install RKE2 SELinux policy
      ansible.builtin.command:
        cmd: "rpm -i /tmp/{{ bundle['rke2-selinux-rpm'] }}"

    - name: Install required Kubernetes packages
      ansible.builtin.dnf:
        name:
          - chrony
          - lshw
          - nfs-utils
          - make
          - container-selinux
          - numactl
          - pciutils
          - iptables
          - ipvsadm
          - iscsi-initiator-utils
          - tuned
          - bind-utils
          - wget
          - tar
          - unzip
          - zip
        state: present

    - name: Backup sudoers
      ansible.builtin.copy:
        src: /etc/sudoers
        dest: /etc/sudoers.bak
        remote_src: true
        owner: root
        group: root
        mode: "0440"
        force: false

    - name: Configure OpenSpace passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-openspace-users
        content: |
          {{ openspace_user }} ALL=(ALL) NOPASSWD:ALL
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"

    - name: Configure SELinux enforcing mode
      ansible.builtin.lineinfile:
        path: /etc/selinux/config
        regexp: "^SELINUX="
        line: "SELINUX=enforcing"

    - name: Get current SELinux mode
      ansible.builtin.command:
        cmd: getenforce
      register: selinux_mode
      changed_when: false

    - name: Set SELinux to enforcing
      ansible.builtin.command:
        cmd: setenforce 1
      when: selinux_mode.stdout != "Enforcing"

    - name: Configure RKE2 kernel tunings
      ansible.builtin.copy:
        dest: /etc/sysctl.d/50-substrate.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          fs.inotify.max_user_instances=12288
          fs.inotify.max_user_watches=524288
          net.core.rmem_default=16777216
          net.core.rmem_max=16777216
          net.core.wmem_default=16777216
          net.core.wmem_max=16777216
          net.ipv4.tcp_mem=67108864 67108864 67108864
          net.ipv4.udp_mem=16777216 16777216 16777216
          net.ipv4.ip_forward=1
      notify: Apply sysctl settings

    - name: Configure required kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/custom-modules.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          ip_vs
          ip_vs_rr

    - name: Load required kernel modules
      ansible.builtin.command:
        cmd: "modprobe {{ item }}"
      loop:
        - ip_vs
        - ip_vs_rr
      changed_when: false

    - name: Create RKE2 configuration directory
      ansible.builtin.file:
        path: /etc/rancher/rke2/config.yaml.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure RKE2 system default registry
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/config.yaml.d/60-rancher.yaml
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "system-default-registry": ""
          }

    - name: Disable firewalld
      ansible.builtin.systemd_service:
        name: firewalld
        state: stopped
        enabled: false
      failed_when: false

    - name: Disable and mask irqbalance
      ansible.builtin.systemd_service:
        name: irqbalance
        state: stopped
        enabled: false
        masked: true
      failed_when: false

    - name: Get active tuned profile
      ansible.builtin.command:
        cmd: tuned-adm active
      register: tuned_active
      changed_when: false

    - name: Configure tuned latency-performance profile
      ansible.builtin.command:
        cmd: tuned-adm profile latency-performance
      when: "'latency-performance' not in tuned_active.stdout"

    - name: Enable and start iscsid
      ansible.builtin.systemd_service:
        name: iscsid
        state: started
        enabled: true


    # ------------------------------------------------------------------
    # OSDC-only configuration
    # ------------------------------------------------------------------

    - name: Configure OSDC nodes
      when: "'osdc' in group_names"
      block:
        - name: Install OSDC kernel modules
          ansible.builtin.dnf:
            name: kernel-modules-extra
            state: present

        - name: Create Kratos data directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: "{{ openspace_user }}"
            group: "{{ openspace_user }}"
            mode: "0770"
          loop:
            - /data/kratos
            - /data/kratos/vrecorder
            - /data/kratos/playback

        - name: Check Kratos SELinux file context
          ansible.builtin.shell:
            cmd: >-
              semanage fcontext -l |
              grep -Fq '/data/kratos(/.*)?'
          register: kratos_fcontext
          changed_when: false
          failed_when: kratos_fcontext.rc not in [0, 1]

        - name: Add Kratos SELinux file context
          ansible.builtin.command:
            cmd: >-
              semanage fcontext
              -a
              -t container_file_t
              '/data/kratos(/.*)?'
          when: kratos_fcontext.rc != 0

        - name: Apply Kratos SELinux contexts
          ansible.builtin.command:
            cmd: restorecon -Rv /data/kratos
          register: restorecon_kratos
          changed_when: restorecon_kratos.stdout | length > 0

        - name: Add intel_idle C-state kernel parameter
          ansible.builtin.replace:
            path: /etc/default/grub
            regexp: '^(GRUB_CMDLINE_LINUX=")(?![^"]*intel_idle\.max_cstate=0)'
            replace: '\1intel_idle.max_cstate=0 '
          notify: Regenerate grub configuration

        - name: Add processor C-state kernel parameter
          ansible.builtin.replace:
            path: /etc/default/grub
            regexp: '^(GRUB_CMDLINE_LINUX=")(?![^"]*processor\.max_cstate=1)'
            replace: '\1processor.max_cstate=1 '
          notify: Regenerate grub configuration

        - name: Install RX ring adjustment script
          ansible.builtin.copy:
            dest: /usr/local/bin/adjust_rx_ring.sh
            owner: root
            group: root
            mode: "0744"
            content: |
              #!/bin/bash

              if [ -z "$1" ]; then
                  echo "No interface provided"
                  exit 1
              fi

              INTERFACE="$1"

              MAX_VAL=$(
                  /sbin/ethtool -g "$INTERFACE" |
                  /bin/egrep "RX:" |
                  /bin/head -1 |
                  /bin/awk '{print $2}'
              )

              if [ -n "$MAX_VAL" ]; then
                  /sbin/ethtool -G "$INTERFACE" rx "$MAX_VAL"
              else
                  echo "Failed to get max val"
              fi

        - name: Configure OSDC NIC udev rules
          ansible.builtin.copy:
            dest: /etc/udev/rules.d/50-substrate.rules
            owner: root
            group: root
            mode: "0644"
            content: |
              SUBSYSTEM=="net", ACTION=="add|move|change", DRIVERS=="iavf", RUN+="/usr/sbin/ip link set %k qlen 100000"
              SUBSYSTEM=="net", ACTION=="add|move|change", DRIVERS=="iavf", RUN+="/usr/local/bin/adjust_rx_ring.sh %k"

              SUBSYSTEM=="net", ACTION=="add|move|change", DRIVERS=="ice", RUN+="/usr/sbin/ip link set %k qlen 100000"
              SUBSYSTEM=="net", ACTION=="add|move|change", DRIVERS=="ice", RUN+="/usr/local/bin/adjust_rx_ring.sh %k"

              SUBSYSTEM=="net", ACTION=="add|move|change", DRIVERS=="i40e", RUN+="/usr/sbin/ip link set %k qlen 100000"
              SUBSYSTEM=="net", ACTION=="add|move|change", DRIVERS=="i40e", RUN+="/usr/local/bin/adjust_rx_ring.sh %k"
          notify:
            - Reload udev rules
            - Trigger udev rules

        - name: Create RKE2 server systemd override directory
          ansible.builtin.file:
            path: /etc/systemd/system/rke2-server.service.d
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Create RKE2 agent systemd override directory
          ansible.builtin.file:
            path: /etc/systemd/system/rke2-agent.service.d
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Configure RKE2 server realtime limits
          ansible.builtin.copy:
            dest: /etc/systemd/system/rke2-server.service.d/override.conf
            owner: root
            group: root
            mode: "0644"
            content: |
              [Service]
              LimitRTPRIO=infinity
              LimitNOFILE=infinity
              ExecStartPre=-/bin/sh -c 'rm -f /var/lib/kubelet/cpu_manager_state /var/lib/kubelet/memory_manager_state'
          notify: Reload systemd

        - name: Configure RKE2 agent realtime limits
          ansible.builtin.copy:
            dest: /etc/systemd/system/rke2-agent.service.d/override.conf
            owner: root
            group: root
            mode: "0644"
            content: |
              [Service]
              LimitRTPRIO=infinity
              LimitNOFILE=infinity
              ExecStartPre=-/bin/sh -c 'rm -f /var/lib/kubelet/cpu_manager_state /var/lib/kubelet/memory_manager_state'
          notify: Reload systemd

        - name: Apply configuration handlers before reboot
          ansible.builtin.meta: flush_handlers

        - name: Reboot OSDC node
          ansible.builtin.reboot:
            reboot_timeout: 900


  handlers:
    - name: Apply sysctl settings
      ansible.builtin.command:
        cmd: sysctl --system

    - name: Regenerate grub configuration
      ansible.builtin.command:
        cmd: grub2-mkconfig --update-bls-cmdline -o /boot/grub2/grub.cfg

    - name: Reload udev rules
      ansible.builtin.command:
        cmd: udevadm control --reload

    - name: Trigger udev rules
      ansible.builtin.command:
        cmd: udevadm trigger

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true