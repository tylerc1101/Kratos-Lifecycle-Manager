---
- name: Create Rancher SSH secret
  hosts: mcm1
  become: true
  gather_facts: false

  vars:
    kubectl_path: /var/lib/rancher/rke2/bin/kubectl
    kubeconfig_path: /etc/rancher/rke2/rke2.yaml

    rancher_namespace: openspace-system
    rancher_ssh_secret: rancher-ssh

    rancher_ssh_key_source: "{{ klm_home }}/.ssh/rancher_ssh_key"

  tasks:
    - name: Read Rancher SSH private key from KLM host
      ansible.builtin.slurp:
        src: "{{ rancher_ssh_key_source }}"
      delegate_to: "{{ groups['klm_host'][0] }}"
      register: rancher_ssh_key
      no_log: true

    - name: Create temporary SSH key file on MCM
      ansible.builtin.tempfile:
        state: file
        prefix: rancher_ssh_
      register: rancher_ssh_temp

    - name: Write Rancher SSH private key to temporary file
      ansible.builtin.copy:
        content: "{{ rancher_ssh_key.content | b64decode }}"
        dest: "{{ rancher_ssh_temp.path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Create or update Rancher SSH secret
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          {{ kubectl_path }}
          --kubeconfig={{ kubeconfig_path }}
          create secret generic
          -n {{ rancher_namespace }}
          {{ rancher_ssh_secret }}
          --type=opaque
          --from-literal=username={{ openspace_user }}
          --from-file=sshKey={{ rancher_ssh_temp.path }}
          --dry-run=client
          -o yaml
          |
          {{ kubectl_path }}
          --kubeconfig={{ kubeconfig_path }}
          apply -f -
        executable: /bin/bash
      register: rancher_ssh_secret_result
      no_log: true

    - name: Remove temporary SSH private key
      ansible.builtin.file:
        path: "{{ rancher_ssh_temp.path }}"
        state: absent

    - name: Show Rancher SSH secret result
      ansible.builtin.debug:
        msg: "Secret {{ rancher_ssh_secret }} configured in namespace {{ rancher_namespace }}"