---
- name: Gather RKE2 kubeconfig from MCM1
  hosts: mcm1
  become: true
  gather_facts: false

  tasks:
    - name: Read RKE2 kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/rke2/rke2.yaml
      register: mcm_kubeconfig
      no_log: true


- name: Store RKE2 kubeconfig on KLM host
  hosts: klm_host
  become: true
  gather_facts: false

  vars:
    mcm_host: mcm1
    kubeconfig_path: "{{ klm_home }}/secrets/local.yml"

  tasks:
    - name: Verify MCM1 has an Ansible connection address
      ansible.builtin.assert:
        that:
          - hostvars[mcm_host].ansible_host is defined
        fail_msg: >-
          {{ mcm_host }} must have ansible_host defined in the inventory.

    - name: Ensure KLM secrets directory exists
      ansible.builtin.file:
        path: "{{ klm_home }}/secrets"
        state: directory
        owner: kratos
        group: kratos
        mode: "0700"

    - name: Write MCM1 kubeconfig for local use
      ansible.builtin.copy:
        content: >-
          {{
            hostvars[mcm_host].mcm_kubeconfig.content
            | b64decode
            | replace(
                'https://127.0.0.1:6443',
                'https://' ~ hostvars[mcm_host].ansible_host ~ ':6443'
              )
          }}
        dest: "{{ kubeconfig_path }}"
        owner: kratos
        group: kratos
        mode: "0600"
      no_log: true

    - name: Show kubeconfig location
      ansible.builtin.debug:
        msg: "Kubeconfig stored at {{ kubeconfig_path }}"