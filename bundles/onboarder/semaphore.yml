repositories:
  - name: Onboarder
    url: file:///opt/openspace/bundles/onboarder
    branch: main

views:
  - name: Onboarder Tasks

templates:

  - name: Generate SSH Key
    description: Generate the SSH key used by the Onboarder deployment.
    view: Onboarder Tasks
    repository: Onboarder
    playbook: playbooks/generate-ssh-key.yml

  - name: Node Prep
    description: Prepare a node for Kubernetes or OpenSpace deployment.
    view: Onboarder Tasks
    repository: Onboarder
    playbook: playbooks/node-prep.yml

  - name: Push SSH Key
    description: Deploy the Onboarder SSH public key to selected nodes.
    view: Onboarder Tasks
    repository: Onboarder
    playbook: playbooks/push-ssh-key.yml

  - name: Prep Container
    description: Prepare the Onboarder deployment container and configuration.
    view: Onboarder Tasks
    repository: Onboarder
    playbook: playbooks/start-onboarder.yml

  - name: Deploy Kubernetes
    description: Deploy the management Kubernetes cluster.
    view: Onboarder Tasks
    repository: Onboarder
    app: bash
    playbook: scripts/run-make.sh

  - name: Deploy Harbor
    description: Deploy Harbor.
    view: Onboarder Tasks
    repository: Onboarder
    app: bash
    playbook: scripts/run-make.sh

  - name: Deploy Rancher
    description: Deploy Rancher.
    view: Onboarder Tasks
    repository: Onboarder
    app: bash
    playbook: scripts/run-make.sh

  - name: Deploy Gitea
    description: Deploy Gitea.
    view: Onboarder Tasks
    repository: Onboarder
    app: bash
    playbook: scripts/run-make.sh

  - name: Deploy ArgoCD
    description: Deploy ArgoCD.
    view: Onboarder Tasks
    repository: Onboarder
    app: bash
    playbook: scripts/run-make.sh

  - name: Deploy OpenSpace Cluster
    description: Deploy an OpenSpace Kubernetes cluster.
    view: Onboarder Tasks
    repository: Onboarder
    app: bash
    playbook: scripts/deploy-openspace-cluster.sh
    allow_override_args_in_task: true

  - name: Post OSDC
    description: Perform post-deployment configuration for the OSDC cluster.
    view: Onboarder Tasks
    repository: Onboarder
    playbook: playbooks/post_osdc.yml
