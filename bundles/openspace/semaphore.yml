repositories:
  - name: OpenSpace
    url: file:///opt/openspace/bundles/openspace
    branch: main

views:
  - name: OpenSpace Tasks

templates:
  - name: Generate Config
    description: Generate the OpenSpace configuration for the selected system.
    view: OpenSpace Tasks
    repository: OpenSpace
    playbook: playbooks/generate-config.yml

  - name: Push Images
    description: Push OpenSpace images to the target environment.
    view: OpenSpace Tasks
    repository: OpenSpace
    app: bash
    playbook: scripts/push-images.sh

  - name: Start OpenSpace
    description: Start the OpenSpace deployment.
    view: OpenSpace Tasks
    repository: OpenSpace
    app: bash
    playbook: scripts/start.sh
