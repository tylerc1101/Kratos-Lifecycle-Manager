---
- name: Verify root elevation
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Get effective user id
      ansible.builtin.command: id -u
      register: effective_uid
      changed_when: false

    - name: Confirm root access
      ansible.builtin.assert:
        that:
          - effective_uid.stdout == "0"
        fail_msg: "Ansible did not elevate to root"
        success_msg: "Root elevation succeeded"
