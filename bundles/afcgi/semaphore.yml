# ============================================================
# AFCGI Semaphore Resources
# ============================================================

repositories:
  - name: AFCGI Environment
    url: file:///opt/openspace/environments/afcgi
    branch: main

# Shared AFCGI view. Workflows placed here are contract/site orchestration
# workflows rather than reusable capability workflows.
views:
  - name: AFCGI

# Profiles are reusable system recipes. KLM expands the selected profile:
#   {system}       -> SKCT2
#   {system_lower} -> skct2
#   {profile}      -> ground
#   {environment}  -> afcgi
profiles:
  ground:
    inventories:
      - name: "{system}"
        type: file
        inventory: "inventory/{system_lower}.yml"
        repository: AFCGI Environment
        ssh_key: AFCGI SSH User
        become_key: AFCGI Root

    # Keep a per-system view for AFCGI tasks that are useful to run directly.
    views:
      - name: "{system}"

    templates:
      - name: "{system} MGMT KVM Networking"
        description: Build the AFCGI management KVM network bridges.
        view: "{system}"
        repository: AFCGI Environment
        inventory: "{system}"
        playbook: playbooks/mgmt-kvm-networking.yml

      - name: "{system} Stage Repositories"
        description: Copy AFCGI repository files to /opt/openspace/repos on the selected host(s).
        view: "{system}"
        repository: AFCGI Environment
        inventory: "{system}"
        playbook: playbooks/stage-repos.yml
        allow_override_args_in_task: true

      - name: "{system} Change OPNSense Settings"
        description: Apply AFCGI-specific settings to the generated OPNSense configuration.
        view: "{system}"
        repository: AFCGI Environment
        inventory: "{system}"
        playbook: playbooks/change-opnsense-settings.yml

    workflows:
      # Semaphore 2.19 does not nest workflows. This workflow therefore
      # references the same BaseKit task templates used by the standalone
      # "BaseKit - Infrastructure Install" workflow and inserts the AFCGI
      # site-specific steps where they belong.
      - name: Ground Infrastructure Install
        description: Build AFCGI ground infrastructure for the selected system.
        view: AFCGI

        nodes:
          - id: mgmt_kvm_networking
            type: task
            template: "{system} MGMT KVM Networking"

          - id: stage_repositories
            type: task
            template: "{system} Stage Repositories"
            task_params:
              params:
                limit:
                  - mgmt-kvm

          - id: bootstrap_mgmt_kvm
            type: task
            template: basekit::Bootstrap MGMT KVM

          - id: prepare_opnsense
            type: task
            template: basekit::Prepare OPNSense

          - id: change_opnsense_settings
            type: task
            template: "{system} Change OPNSense Settings"

          - id: deploy_opnsense
            type: task
            template: basekit::Deploy OPNSense

          - id: stage_rhel_image
            type: task
            template: basekit::Stage RHEL Image

          - id: deploy_mcm
            type: task
            template: basekit::Deploy VMs
            task_params:
              params:
                limit:
                  - mcm

          - id: bootstrap_mcm
            type: task
            template: basekit::Bootstrap Nodes
            task_params:
              params:
                limit:
                  - mcm

          - id: deploy_osms
            type: task
            template: basekit::Deploy VMs
            task_params:
              params:
                limit:
                  - osms

          - id: bootstrap_osms
            type: task
            template: basekit::Bootstrap Nodes
            task_params:
              params:
                limit:
                  - osms

          - id: bootstrap_osdc
            type: task
            template: basekit::Bootstrap Nodes
            task_params:
              params:
                limit:
                  - osdc

        edges:
          - {from: mgmt_kvm_networking, to: stage_repositories, condition: on_success}
          - {from: stage_repositories, to: bootstrap_mgmt_kvm, condition: on_success}
          - {from: bootstrap_mgmt_kvm, to: prepare_opnsense, condition: on_success}
          - {from: prepare_opnsense, to: change_opnsense_settings, condition: on_success}
          - {from: change_opnsense_settings, to: deploy_opnsense, condition: on_success}
          - {from: deploy_opnsense, to: stage_rhel_image, condition: on_success}
          - {from: stage_rhel_image, to: deploy_mcm, condition: on_success}
          - {from: deploy_mcm, to: bootstrap_mcm, condition: on_success}
          - {from: bootstrap_mcm, to: deploy_osms, condition: on_success}
          - {from: deploy_osms, to: bootstrap_osms, condition: on_success}
          - {from: bootstrap_osms, to: bootstrap_osdc, condition: on_success}

  # Cloud intentionally remains separate. The AFCGI bundle can contain ground
  # and cloud systems while each profile brings in its own dependencies and
  # workflows.
  cloud:
    views:
      - name: "{system}"

# Per-system additions belong here only when one site differs from the shared
# ground/cloud profile.
systems: {}
