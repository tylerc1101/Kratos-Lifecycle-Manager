---
all:
  vars:
    env_name: skct2
    domain_name: base-kit-2.kratos

    klm_home: /opt/openspace
    openspace_user: kratos

    ntp_servers:
      - 192.168.2.100

    # DNS reachable through br-wan.
    # br-wan uses wan_dns.servers directly.
    # OPNsense forwarding entries inherit the same servers unless an
    # individual forwarding entry provides its own servers list.
    wan_dns:
      servers:
        - 10.243.25.50
        - 10.243.25.53
      search_domains:
        - rtlogic.com

      forwarding:
        - domain: rtlogic.com
          description: Kratos Dev DNS

    opnsense:
      wan_ip: 10.243.76.221
      gateway: 10.243.76.1
      cidr: 23

    ssh_key: rancher_ssh_key

    bundle_overrides: {}

  children:
    klm_host:
      hosts:
        mgmt-kvm:
          ansible_host: 10.243.76.15

    vms:
      children:
        mcm:
          hosts:
            mcm1:
              ansible_host: 192.168.2.8

        osms:
          hosts:
            osms1:
              ansible_host: 192.168.2.9

    osdc:
      hosts:
        osdc1:
          ansible_host: 192.168.2.16

        osdc2:
          ansible_host: 192.168.2.17
